- name: useradd
  ansible.builtin.user:
    name: roboshop
- name: delete app folder 
  ansible.builtin.file:
    path: /app
    state: absent

- name: create app folder
  ansible.builtin.file:
    path: /app
    state: directory

- name: download content 
  ansible.builtin.unarchive:
    src: https://roboshop-artifacts.s3.amazonaws.com/{{component}}.zip 
    dest: /app
    remote_src: yes

   











